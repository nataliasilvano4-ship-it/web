<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pon en adopción — CatMatch</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="adopcion.css">
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <div class="logo">
        <img src="catmatch.png" alt="Cat Match" class="logo-img">
      </div>
      <div class="header-slogan">Pon en adopción</div>
    </div>

    <nav class="navbar">
      <ul>
        <li><a href="adopta.html">Adopta un gatito</a></li>
        <li><a href="pon en adopción.html">Pon en adopción</a></li>
        <li><a href="tienda.html">Tienda solidaria</a></li>
        <li><a href="consejos.html">Consejos</a></li>
        <li><a href="sobre.html">Sobre nosotros</a></li>
        <li><a href="contacto.html">Contáctanos</a></li>
      </ul>
    </nav>
  </header>

    <section class="hero-form">
        <img src="cati (1).png" class="cat-eyes" alt="Gato mirando">

        <h2 class="hero-title">¿Tienes un gato que necesita un hogar?</h2>
        <p class="hero-sub">
            "Nosotros te ayudamos a encontrar a su familia ideal."
        </p>

        <form class="adopt-form">
            <label>Tu nombre:</label>
            <input type="text" required>

            <label>Motivo:</label>
            <input type="text" required>

            <label>Descripción del gatito:</label>
            <textarea required></textarea>

            <label>Foto del gatito:</label>
            <input type="file" accept="image/*" class="file-input" required>

            <button type="submit">Enviar</button>
        </form>

        <img src="bebés.png" class="kittens-bottom" alt="Gatitos">
    </section>

<script src="script.js"></script>
</body>
</html>

        <p class="subtitulo">
            Si tienes consultas o deseas más información, completa el siguiente formulario
        </p>

        <form id="contactForm" class="formulario">

            <label>Nombre completo:</label>
            <input type="text" id="nombre">

            <label>Correo electrónico:</label>
            <input type="email" id="correo">

            <label>Asunto:</label>
            <input type="text" id="asunto" class="input-largo">

            <label>Mensaje:</label>
            <textarea id="mensaje" rows="4"></textarea>

            <button type="submit" class="btn-enviar">Enviar mensaje</button>

        </form>
